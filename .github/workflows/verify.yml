name: Verify Wuyoo
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, fileinfo, filter, mbstring, pdo_mysql, pdo_pgsql, pdo_sqlite, redis
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer validate && composer check-platform-reqs && composer audit --locked
      # Regression scripts are maintained outside the runtime source project.
      # Run /www/wuyoo-tests against an isolated source copy as documented in README.md.
